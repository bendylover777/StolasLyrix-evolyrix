name: Build Stolas Lyrics Bridge
on:
  workflow_dispatch:
  push:
    paths:
      - bridge.py
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install winsdk pyinstaller
      - run: pyinstaller --onefile --noconsole --collect-all winsdk --name StolasLyricsBridge bridge.py
      - uses: actions/upload-artifact@v4
        with:
          name: StolasLyricsBridge-exe
          path: dist/StolasLyricsBridge.exe
